[workspace]
members = ["crates/epub-navigator"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
epub-stack = "0.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
thiserror = "2.0.21"
url = "2.5.8"
wasm-bindgen = "0.2.105"

[workspace.lints.rust]
unsafe_code = "forbid"
